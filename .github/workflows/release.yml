name: Release instancio-fixture-builder

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  full-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        if: github.ref == 'refs/heads/main'
        run: |
          mvn clean && mvn -pl '!instancio-fixture-builder-tests' -Ppublication && mvn -pl '!instancio-fixture-builder-tests' jreleaser:full-release